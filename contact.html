<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Bram Labs</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/styles.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/spaceship.js" defer></script>
    <script src="js/snake-nav.js" defer></script>

<body class="subpage">
    <div class="container">
        <header class="header">
            <div class="logo-container">
                <a href="index.html"><img src="images/logo.png" alt="Bram Labs Logo" class="logo"></a>
            </div>
            <div class="header-text">
                <h1 class="company-title">Bram Labs <span class="company-type">ApS</span></h1>
            </div>
            <nav class="site-nav">
                <a href="index.html" class="nav-link">Ventures</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </nav>
        </header>

        <main class="contact-content">
            <div class="contact-card">
                <h2 class="contact-heading">Get in Touch</h2>
                <p class="contact-description">Have an idea, a question, or just want to talk tech? Reach out — we'd love to hear from you.</p>
                <a class="contact-email-link" id="contactEmail" href="#" onclick="this.href='mai'+'lto:'+'hi'+'@'+'bramlabs'+'.io'">
                    <span>hi</span><span>@</span><span>bramlabs.io</span>
                </a>
            </div>
        </main>
    </div>

    <div id="spaceship">
        <svg width="40" height="24" viewBox="0 0 40 24" fill="none">
            <ellipse cx="20" cy="12" rx="18" ry="6" fill="#4a5568" opacity="0.8"/>
            <ellipse cx="28" cy="12" rx="8" ry="4" fill="#78dbff" opacity="0.6"/>
            <path d="M8 8 L2 4 L4 12 L2 20 L8 16 Z" fill="#6b7280" opacity="0.7"/>
            <path d="M8 8 L2 4 L4 12 L2 20 L8 16 Z" fill="#6b7280" opacity="0.7" transform="scale(1, -1) translate(0, -24)"/>
            <ellipse cx="5" cy="12" rx="3" ry="2" fill="#ff77c6" opacity="0.9"/>
            <ellipse cx="3" cy="12" rx="2" ry="1" fill="#ffffff" opacity="0.6"/>
            <line x1="12" y1="9" x2="25" y2="9" stroke="#78dbff" stroke-width="0.5" opacity="0.4"/>
            <line x1="12" y1="15" x2="25" y2="15" stroke="#78dbff" stroke-width="0.5" opacity="0.4"/>
        </svg>
    </div>
